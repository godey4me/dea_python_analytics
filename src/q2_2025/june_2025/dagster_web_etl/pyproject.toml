[project]
name = "dagster_web_etl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
    "dagster",
    "dagster-cloud",
    "sqlalchemy",
    "psycopg2-binary",
    "pandas"
]

[project.optional-dependencies]
dev = [
    "dagster-webserver", 
    "pytest",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.dagster]
module_name = "dagster_web_etl.definitions"
code_location_name = "dagster_web_etl"

[tool.setuptools.packages.find]
exclude=["dagster_web_etl_tests"]
